[workspace]
resolver = "3"
members = ["crates/rattus-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["barbieri97"]
repository = "https://github.com/barbieri97/rattus"

# The simulation runs thousands of steps per frame when time is accelerated,
# so keep it optimized even in debug builds and tests.
[profile.dev.package.rattus-core]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
