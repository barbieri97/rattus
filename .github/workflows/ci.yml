name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Simulation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p rattus-core --all-targets -- -D warnings
      - name: Tests (including the learning phenomena)
        run: cargo test -p rattus-core
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/bindings
          test -z "$(git status --porcelain -- src/bindings)" || { git status --porcelain -- src/bindings; echo "::error::Run 'cargo test -p rattus-core' and commit src/bindings"; exit 1; }

  frontend:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build

  app:
    name: Desktop app (Linux check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - run: npm ci
      - name: Build the interface
        run: npm run build
      - name: Clippy
        run: cargo clippy -p rattus --all-targets -- -D warnings
